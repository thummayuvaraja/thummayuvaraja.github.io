<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Truth or Dare: Premium Standalone Arena</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons for High-fidelity UI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap');
    
    body {
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      background-color: #030712;
      -webkit-tap-highlight-color: transparent;
    }
    
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Premium visual effects */
    .neon-glow-cyan {
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.9), 0 0 25px rgba(34, 211, 238, 0.45);
    }
    .neon-glow-rose {
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.9), 0 0 25px rgba(244, 63, 94, 0.45);
    }
    .neon-glow-amber {
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.9), 0 0 25px rgba(245, 158, 11, 0.45);
    }
    .neon-glow-purple {
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.9), 0 0 25px rgba(168, 85, 247, 0.45);
    }
    .neon-glow-fuchsia {
      text-shadow: 0 0 10px rgba(217, 70, 239, 0.9), 0 0 25px rgba(217, 70, 239, 0.45);
    }
    .neon-glow-red {
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.95), 0 0 30px rgba(239, 68, 68, 0.5);
    }

    /* Premium glassmorphic container style */
    .glass {
      background: rgba(10, 8, 20, 0.76);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.82);
    }

    .ambient-grad {
      transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Hardware-accelerated visual routing transition */
    @keyframes popScale {
      0% { transform: scale(1); filter: brightness(1); }
      40% { transform: scale(0.95); filter: brightness(1.8); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .animate-pop-scale {
      animation: popScale 0.15s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
    }

    /* Celebration effect for target landing */
    @keyframes targetLand {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7); }
      50% { transform: scale(1.3); box-shadow: 0 0 20px 10px rgba(34, 211, 238, 0); }
      100% { transform: scale(1.15); box-shadow: 0 0 12px 2px rgba(34, 211, 238, 0.3); }
    }
    .animate-target-land {
      animation: targetLand 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes subtleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(0.4deg); }
    }
    .animate-float {
      animation: subtleFloat 5s ease-in-out infinite alternate;
    }

    /* Hide standard scrollbars yet preserve scrolling features */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none; /* IE/Edge */
      scrollbar-width: none; /* Firefox */
    }
  </style>
</head>
<body id="dynamicBody" class="w-full max-w-full h-[100dvh] min-h-[100dvh] flex flex-col justify-between items-center relative overflow-hidden bg-gradient-to-b from-[#061d24] via-[#004e64] to-[#124e3f] p-3 text-slate-100 selection:bg-cyan-500 selection:text-white ambient-grad">

  <!-- DYNAMIC AMBIENT BACKDROP PARTICLES -->
  <div id="ambientOverlay" class="absolute inset-0 bg-transparent opacity-30 transition-all duration-1000 ease-in-out pointer-events-none z-0"></div>
  <div id="ambientGlow1" class="absolute w-[300px] h-[300px] bg-cyan-600/10 rounded-full blur-[100px] top-[10%] left-[-15%] pointer-events-none transition-all duration-1000"></div>
  <div id="ambientGlow2" class="absolute w-[340px] h-[340px] bg-fuchsia-600/10 rounded-full blur-[120px] bottom-[10%] right-[-15%] pointer-events-none transition-all duration-1000" style="animation-delay: 2s;"></div>

  <!-- 1. HEADER & UI FIX: Adjusted vertically (pt-10) with massive bold styling & neon elements -->
  <header class="w-full max-w-md mx-auto z-10 flex flex-col items-center select-none text-center pt-10 pb-1 flex-shrink-0 animate-float">
    <div class="relative flex flex-col items-center gap-1">
      <div id="titleGlow" class="absolute inset-0 w-40 h-16 mx-auto rounded-full blur-[26px] pointer-events-none opacity-40 bg-cyan-500/15 transition-colors duration-1000"></div>
      
      <h1 id="titleHeading" class="text-4xl sm:text-5xl font-extrabold tracking-[-0.04em] uppercase flex items-center justify-center font-display leading-none select-none transition-all duration-700 neon-glow-cyan">
        <span id="titleTruth" class="transition-all duration-700 text-cyan-400">TRUTH</span>
        <span id="titleOr" class="mx-2 text-[10px] font-mono font-black italic tracking-wider border border-white/10 rounded-md px-1.5 py-0.5 bg-white/5 text-slate-400 align-middle">OR</span>
        <span id="titleDare" class="transition-all duration-700 text-fuchsia-400">DARE</span>
      </h1>
      <div id="titleLine" class="h-[3px] w-16 rounded-full mt-2 transition-all duration-700 bg-gradient-to-r from-cyan-400 to-fuchsia-400 shadow-[0_0_10px_rgba(34,211,238,0.7)]"></div>
    </div>

    <!-- Active Soundtrack Toggle Indicator -->
    <div class="mt-2.5 flex items-center justify-center gap-2 flex-wrap">
      <div id="headerBadge" class="inline-flex items-center gap-1.5 px-3 py-0.5 bg-cyan-500/10 border border-cyan-400 text-cyan-300 rounded-full text-[8px] font-black tracking-widest uppercase shadow-inner transition-all duration-500">
        Premium Party Arena
      </div>
      <button onclick="toggleSoundtracks()" id="soundToggleBtn" class="p-1 px-3 rounded-full border border-white/10 bg-white/5 text-slate-300 hover:bg-white/15 text-[8px] font-black tracking-wide flex items-center gap-1.5 transition-all pointer-events-auto cursor-pointer" title="Toggle audio synthesizer effects">
        <i id="soundIcon" class="fa-solid fa-volume-high text-cyan-400"></i>
        <span>SOUNDS: ON</span>
      </button>
    </div>
  </header>

  <!-- MAIN ADAPTIVE GAME VIEWPORT -->
  <main class="w-full max-w-md mx-auto my-1.5 flex-grow flex items-center justify-center z-10 overflow-hidden px-1">
    <div id="gameContainer" class="w-full h-full max-h-[520px] glass rounded-[26px] p-4 relative overflow-hidden flex flex-col justify-between shadow-2xl transition-all duration-300">
      
      <!-- SCREEN 1: LOBBY REGISTRATION & DECK CHOOOSERS -->
      <section id="screen-lobby" class="flex flex-col h-full justify-between overflow-hidden">
        <div class="flex-grow overflow-y-auto space-y-4 pr-1 no-scrollbar">
          
          <!-- 2. PLAYER LOBBY EMORJI ENGINE -->
          <div class="flex flex-col gap-1.5">
            <label class="text-[10.5px] font-black tracking-wider text-slate-400 flex items-center justify-between uppercase">
              <span>PARTY GUESTS COUNT <span id="lobby-count" class="text-xs text-cyan-400 bg-cyan-500/10 px-2.5 py-0.5 rounded-full ml-1 font-mono font-bold">4</span></span>
              <span class="text-[8.5px] font-bold text-slate-500 lowercase">(REQUIRS ≥ 2)</span>
            </label>
            
            <div class="flex gap-2">
              <div id="selected-emoji-display" class="flex items-center justify-center text-xl bg-white/5 border border-white/10 w-11 h-11 rounded-xl select-none shadow-inner">🦊</div>
              <input type="text" id="player-input-box" placeholder="Enter guest name..." class="flex-grow bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-xs font-semibold focus:outline-none focus:border-cyan-500 transition-colors placeholder:text-slate-500 text-white">
              <button onclick="addNewPlayer()" class="bg-cyan-600 hover:bg-cyan-500 text-white w-11 h-11 rounded-xl transition-all flex items-center justify-center shadow-lg active:scale-95 cursor-pointer">
                <i class="fa-solid fa-plus text-sm"></i>
              </button>
            </div>

            <!-- Scrollable Emoji Slider Selectors -->
            <div class="overflow-x-auto no-scrollbar select-none mt-1">
              <div id="emoji-selectors-slider" class="flex gap-2 pb-1">
                <!-- Populated dynamically: 🦊, 🐼, 🐨, 🐯, 🦁, 🐸, 🐙, 🦄, 🦖 etc. -->
              </div>
            </div>

            <!-- Active registered listing -->
            <div class="max-h-[70px] overflow-y-auto mt-1 mx-0.5 pr-0.5 no-scrollbar">
              <div id="avatar-bubbles-wrapper" class="flex flex-wrap gap-2">
                <!-- Guest listing -->
              </div>
            </div>
          </div>

          <!-- DYNAMIC GAME DECK CATEGORIES SELECTION -->
          <div class="flex flex-col gap-1.5 border-t border-white/5 pt-3">
            <label class="text-[10.5px] font-black tracking-wider text-slate-400 uppercase">SELECT ACTIVE PLAYING DECK</label>
            
            <div class="grid grid-cols-2 gap-2">
              <!-- Friends -->
              <button id="deck-btn-friends" onclick="changeCurrentDeck('friends')" class="p-2.5 rounded-xl border border-cyan-400 bg-cyan-950/20 text-slate-100 flex items-center justify-between text-[11px] font-bold text-left transition-all cursor-pointer">
                <span class="flex items-center gap-1.5 truncate"><span class="text-xs">🎉</span> Friends</span>
                <i class="fa-solid fa-circle-check text-cyan-400 text-[10px]" id="deck-icon-friends"></i>
              </button>
              
              <!-- Couples -->
              <button id="deck-btn-couples" onclick="changeCurrentDeck('couples')" class="p-2.5 rounded-xl border border-white/5 bg-white/5 text-slate-400 flex items-center justify-between text-[11px] font-bold text-left transition-all hover:text-rose-400 cursor-pointer">
                <span class="flex items-center gap-1.5 truncate"><span class="text-xs">👩‍❤️‍👨</span> Lovers/Partners</span>
                <i class="fa-regular fa-circle text-slate-600 text-[10px]" id="deck-icon-couples"></i>
              </button>

              <!-- Family -->
              <button id="deck-btn-family" onclick="changeCurrentDeck('family')" class="p-2.5 rounded-xl border border-white/5 bg-white/5 text-slate-400 flex items-center justify-between text-[11px] font-bold text-left transition-all hover:text-amber-400 cursor-pointer">
                <span class="flex items-center gap-1.5 truncate"><span class="text-xs">🧸</span> Family</span>
                <i class="fa-regular fa-circle text-slate-600 text-[10px]" id="deck-icon-family"></i>
              </button>

              <!-- Deep Minds -->
              <button id="deck-btn-deep" onclick="changeCurrentDeck('deep')" class="p-2.5 rounded-xl border border-white/5 bg-white/5 text-slate-400 flex items-center justify-between text-[11px] font-bold text-left transition-all hover:text-purple-400 cursor-pointer">
                <span class="flex items-center gap-1.5 truncate"><span class="text-xs">🧠</span> Deep Minds</span>
                <i class="fa-regular fa-circle text-slate-600 text-[10px]" id="deck-icon-deep"></i>
              </button>

              <!-- Extreme -->
              <button id="deck-btn-extreme" onclick="changeCurrentDeck('extreme')" class="p-2.5 rounded-xl border border-white/5 bg-white/5 text-slate-400 flex items-center justify-between text-[11px] font-bold text-left transition-all hover:text-fuchsia-400 cursor-pointer">
                <span class="flex items-center gap-1.5 truncate"><span class="text-xs">💥</span> Extreme</span>
                <i class="fa-regular fa-circle text-slate-600 text-[10px]" id="deck-icon-extreme"></i>
              </button>

              <!-- Dark & Bold -->
              <button id="deck-btn-dark" onclick="changeCurrentDeck('dark')" class="p-2.5 rounded-xl border border-white/5 bg-white/5 text-slate-400 flex items-center justify-between text-[11px] font-bold text-left transition-all hover:border-red-650/40 hover:text-red-400 cursor-pointer">
                <span class="flex items-center gap-1.5 truncate"><span class="text-xs">💀</span> Dark & Bold</span>
                <i class="fa-regular fa-circle text-slate-600 text-[10px]" id="deck-icon-dark"></i>
              </button>
            </div>
          </div>
        </div>

        <button onclick="goToArenaLayout()" id="enter-arena-btn" class="w-full py-3.5 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold text-xs tracking-widest uppercase rounded-xl shadow-lg mt-3 transition-colors flex items-center justify-center gap-2 cursor-pointer">
          ENTER SPINNING ARENA <i class="fa-solid fa-circle-play text-sm"></i>
        </button>
      </section>

      <!-- SCREEN 2: 3. UPSCALED SPINNER ARENA -->
      <section id="screen-arena" class="hidden flex-col h-full justify-between items-center overflow-hidden">
        
        <!-- Upscaled ring occupies up to 90% mobile width -->
        <div id="radial-arena-track" class="relative w-[310px] h-[310px] sm:w-[335px] sm:h-[335px] w-[88vw] h-[88vw] max-w-[340px] max-h-[340px] aspect-square rounded-full border border-white/5 bg-black/45 flex items-center justify-center flex-shrink-0 my-1.5 shadow-[inset_0_4px_22px_rgba(0,0,0,0.65)] z-10 transition-all">
          
          <div class="absolute inset-3 rounded-full border border-dashed border-cyan-400/20 pointer-events-none"></div>

          <!-- Participant node placement ring -->
          <div id="arena-players-wrapper" class="absolute inset-0 z-20"></div>

          <!-- Dynamic bottle element with SVG gradients update structure -->
          <div id="bottle" class="absolute w-14 h-40 z-30 pointer-events-none origin-center" style="transform: rotate(0deg); transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.2, 1);">
            <!-- Custom Dynamic SVG Bottled Gradient Vector populated via Javascript -->
          </div>

          <!-- Top-center index pin anchor -->
          <div class="absolute top-1 w-3 h-3 rounded-full z-40 bg-emerald-400 shadow-[0_0_12px_#34d399] pointer-events-none"></div>
        </div>

        <div class="w-full flex flex-col gap-2 flex-shrink-0 z-10">
          <button onclick="spinActiveWheel()" id="spin-btn" class="w-full py-4 rounded-xl font-bold text-xs tracking-widest text-white bg-gradient-to-r from-cyan-500 to-emerald-600 hover:from-cyan-600 hover:to-emerald-700 active:scale-[0.98] shadow-lg transition-all cursor-pointer flex items-center justify-center gap-2 uppercase">
            SPIN THE BOTTLE <i class="fa-solid fa-arrows-spin"></i>
          </button>
          
          <button onclick="returnToLobbyConfig()" class="text-[9px] text-slate-500 hover:text-slate-300 font-extrabold uppercase tracking-widest text-center flex items-center justify-center gap-1 cursor-pointer transition-all pt-1">
            <i class="fa-solid fa-arrow-left"></i> Manage Guests & Party Decks
          </button>
        </div>
      </section>

      <!-- SCREEN 3: DECISION DESTINY (TRUTH OR DARE PATH) -->
      <section id="screen-destiny" class="hidden flex-col gap-3.5 items-center w-full h-full text-center py-2 justify-around">
        <div class="px-3 py-0.5 bg-cyan-550/10 border border-emerald-500/25 text-emerald-400 text-[9px] font-black tracking-widest animate-pulse max-w-max uppercase rounded-full">
          ⚡ DESTINY TARGET DECISION ⚡
        </div>
        
        <div>
          <h2 id="victim-title" class="font-display text-2.5xl sm:text-3xl font-black text-white tracking-tight leading-normal">Sophia's Turn!</h2>
          <p class="text-[10px] text-slate-400 mt-1 uppercase tracking-wider font-bold">Choose your mode of discovery:</p>
        </div>

        <div class="grid grid-cols-2 gap-4 w-full">
          <!-- Truth Path selection -->
          <button onclick="launchTargetChallenge('truth')" class="bg-black/35 hover:bg-cyan-500/10 border border-white/5 hover:border-cyan-500/30 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all hover:-translate-y-0.5 active:scale-95 group cursor-pointer text-center">
            <div class="w-11 h-11 rounded-full bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 group-hover:scale-110 transition-transform shadow-[0_0_10px_rgba(6,182,212,0.15)] animate-pulse">
              <i class="fa-solid fa-question text-lg"></i>
            </div>
            <div>
              <span class="block text-xs font-black tracking-widest text-cyan-400 font-display">TRUTH</span>
              <span class="text-[8px] text-slate-500 mt-0.5 block tracking-wider uppercase font-extrabold">Confess Secret</span>
            </div>
          </button>

          <!-- Dare Path selection -->
          <button onclick="launchTargetChallenge('dare')" class="bg-black/35 hover:bg-rose-500/10 border border-white/5 hover:border-rose-500/30 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all hover:-translate-y-0.5 active:scale-95 group cursor-pointer text-center">
            <div class="w-11 h-11 rounded-full bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 group-hover:scale-110 transition-transform shadow-[0_0_10px_rgba(244,63,94,0.15)] animate-pulse">
              <i class="fa-solid fa-fire text-lg"></i>
            </div>
            <div>
              <span class="block text-xs font-black tracking-widest text-rose-400 font-display">DARE</span>
              <span class="text-[8px] text-slate-500 mt-0.5 block tracking-wider uppercase font-extrabold">Perform Action</span>
            </div>
          </button>
        </div>
        
        <button onclick="dismissToArenaWheel()" class="text-[9px] text-slate-500 hover:text-slate-300 font-extrabold uppercase tracking-widest text-center flex items-center justify-center gap-1 cursor-pointer transition-colors pt-1">
          <i class="fa-solid fa-arrow-left"></i> Re-spin / Cancel Selector
        </button>
      </section>

      <!-- SCREEN 4: DISCOVERY CHALLENGE DISPLAY WITH SKIP & COMPLETE -->
      <section id="screen-challenge" class="hidden flex-col gap-3.5 items-center w-full h-full py-1.5 justify-between">
        <div class="flex items-center justify-between w-full border-b border-white/5 pb-2">
          <div class="flex items-center gap-1.5">
            <span id="label-active-guest" class="text-[10px] font-extrabold bg-white/5 border border-cyan-400/35 px-2.5 py-0.5 rounded-full text-cyan-300 flex items-center gap-1.5 font-display">
              Sophia
            </span>
            <span class="text-[8px] text-slate-500 font-black uppercase tracking-wider">pulls active card</span>
          </div>
          <span id="challengePillType" class="text-[8.5px] font-black tracking-widest px-2.5 py-0.5 rounded-full border bg-cyan-500/10 border-cyan-500/20 text-cyan-300 shadow-[0_0_8px_rgba(6,182,212,0.15)]">
            TRUTH
          </span>
        </div>

        <!-- Custom visual prompt slider frame -->
        <div class="w-full py-6 px-4 bg-black/45 rounded-2xl relative overflow-hidden flex flex-col items-center justify-center text-center my-0.5 border border-white/5 shadow-inner min-h-[140px]">
          <div id="challengeCategoryBadge" class="absolute top-1.5 right-2 rounded px-1.5 py-0.2 text-[7.5px] font-bold tracking-widest bg-white/5 border border-white/10 font-mono text-slate-400 uppercase">
            FRIENDS
          </div>
          <span class="absolute top-2 left-4 text-4xl text-white/5 select-none font-serif font-black">“</span>
          
          <p id="challengeTextPrompt" class="font-display text-[12.5px] sm:text-sm font-bold text-slate-100 leading-normal max-w-[275px] tracking-wide transition-opacity duration-150">
            Evaluating prompt...
          </p>
          
          <span class="absolute bottom-1 right-4 text-4xl text-white/5 select-none font-serif font-black">”</span>
        </div>

        <div class="w-full flex flex-col gap-2">
          <!-- 6. HIGH-PERFORMANCE ROUTING INSTANT COMPLETED BUTTON WITH GRAPHICS POP EFFECT -->
          <button id="completed-btn" onclick="triggerCompletedRoute()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white text-xs font-black tracking-widest uppercase rounded-xl transition-all cursor-pointer flex items-center justify-center gap-1.5 shadow-md">
            <i class="fa-solid fa-circle-check"></i> CHALLENGE COMPLETED
          </button>

          <div class="grid grid-cols-2 gap-1.5">
            <!-- 4. TRACKING SKIP CARD BUTTON pulling non-repetitive prompt -->
            <button onclick="skipActivePrompt()" class="py-2.5 bg-white/5 border border-white/10 hover:bg-white/10 text-white rounded-xl text-[9px] font-bold uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-1 active:scale-95">
              <i class="fa-solid fa-arrows-rotate text-[10px]"></i> SKIP CARD
            </button>
            <button onclick="retreatToArenaWheel()" class="py-2.5 bg-rose-950/20 border border-rose-500/15 text-rose-400 rounded-xl text-[9px] font-bold uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-1 active:scale-95">
              <i class="fa-solid fa-person-running"></i> RETREAT
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer class="w-full max-w-sm mx-auto z-10 text-[9px] text-center font-mono opacity-80 tracking-wide text-slate-500 select-none pb-1 flex-shrink-0 font-extrabold uppercase">
    ⚡ Adaptive Screen Resolution Configured • Full Audio Synth ⚡
  </footer>

  <script>
    // 4. EXHAUSTIVE DECK DATABASE & HIGH VALUE TRACKING QUEUES
    const MASTER_QUESTION_DATABASE = {
      friends: {
        truths: [
          "Who is the most likely person in this room to survive on a deserted island, and why?",
          "Have you ever told a secret you promised to keep, and who did you tell?",
          "What was your genuine first impression of the person sitting to your right?",
          "What is the absolute silliest reason you have ever ended a friendship?",
          "If you had to swap lives with anyone here for 24 hours, who would it be and why?",
          "Have you ever pretended to be busy or asleep to avoid hanging out with someone here?",
          "What is your biggest minor pet peeve about the person sitting directly opposite from you?",
          "What is a secret talent of yours that nobody else in this room knows about?",
          "What is the worst advice you have ever given that someone actually followed?",
          "Which player is the first you would call if you needed help out of a sticky situation?"
        ],
        dares: [
          "Show the group the last 3 photos in your camera roll and explain them.",
          "Do a silent impression of someone in this room until the group guesses it.",
          "Let the person to your left design a wacky hairstyle on you for the next round.",
          "Call a random contact on speaker and sing them 15 seconds of any song.",
          "Speak only in a dramatic Shakespearean accent for the next round of play.",
          "Give a 1-minute passionate speech about how much you appreciate carbonated water.",
          "Do your best runway model walk across the room and hold three extreme poses.",
          "Wear your socks on your hands until the next spinner starts their active turn.",
          "Perform a passionate interpretive dance representing bacon in the frying pan.",
          "Let the group look through your phone recent searches for exactly 15 seconds."
        ]
      },
      couples: {
        truths: [
          "What was the exact moment you realized you had deep feelings for your partner?",
          "What is one funny habit your partner has that you secretly find absolutely precious?",
          "What is the most romantic trip or gesture your partner raised for you?",
          "If you could modify one tiny, harmless habit of your partner, what would it be?",
          "What is your absolute favorite memory of our very first week together?",
          "What is a secret life dream you have not dared to mention fully to your partner?",
          "What would be your absolute dream destination for a spontaneous couple getaway?",
          "What is the funniest text message you have ever received from your partner?"
        ],
        dares: [

    // 5. WEB AUDIO SYNTHESIZER ENGINE (Pure programmatic nodes)
    let audioContextInstance = null;

    function getAudioContext() {
      if (!areSoundsEnabled) return null;
      try {
        if (!audioContextInstance) {
          audioContextInstance = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContextInstance.state === 'suspended') {
          audioContextInstance.resume();
        }
        return audioContextInstance;
      } catch (e) {
        return null;
      }
    }

    function playSynthesizedTone(frequency, duration, type = 'sine', gainVal = 0.08) {
      if (!areSoundsEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(frequency / 4, ctx.currentTime + duration);
        
        gain.gain.setValueAtTime(gainVal, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playTickSound(speedPercentage) {
      // Whirr tick: drops pitch and frequency density tracking the rotating velocity decay
      const pitch = 1600 + (speedPercentage * 1800);
      playSynthesizedTone(pitch, 0.012, 'sine', 0.06);
    }

    function playClick() {
      playSynthesizedTone(3800, 0.015, 'sine', 0.08);
    }

    function playDing() {
      if (!areSoundsEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const triggerTone = (f, d, t) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(0.12, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + d);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + d);
        };
        // Harmonic landing notification chimes
        triggerTone(523.25, 0.15, now);       // C5
        triggerTone(659.25, 0.15, now + 0.08);  // E5
        triggerTone(783.99, 0.15, now + 0.16);  // G5
        triggerTone(1046.50, 0.25, now + 0.24); // C6
      } catch (e) {}
    }

    function playSlide() {
      playSynthesizedTone(600, 0.1, 'sine', 0.06);
    }

    function playSuccessChord() {
      if (!areSoundsEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const triggerTone = (f, d, t) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(0.1, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + d);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + d);
        };
        triggerTone(587.33, 0.2, now); // D5
        triggerTone(739.99, 0.2, now + 0.06); // F#5
        triggerTone(880.00, 0.3, now + 0.12); // A5
      } catch (e) {}
    }

          </defs>
          
          <!-- Outer Glass Outline Shadow -->
          <path d="M 40,30 L 60,30 L 60,70 L 80,100 L 80,260 C 80,285 20,285 20,260 L 20,100 L 40,70 Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
          
          <!-- Liquid Content dynamic fluid level -->
          <path d="M 22,110 L 78,110 L 78,255 C 78,275 22,275 22,255 Z" fill="url(#radialFluidGrad)"/>
          
          <!-- Elegant Highlight Shine Glass Strip -->
          <path d="M 23,100 L 32,100 L 32,258 C 32,270 23,270 23,258 Z" fill="url(#glassReflection)"/>
          
          <!-- Cap Design -->
          <rect x="36" y="15" width="28" height="15" rx="3" fill="#ffffff" opacity="0.9" />
          
          <!-- Central Dynamic Spinning Pointer Indicator -->
          <polygon points="50,15 35,45 65,45" fill="${gradStart}"/>
        </svg>
      `;
    }

    // ARENA DISPLAY PREPARATION
    function goToArenaLayout() {
      if (players.length < 2) return;
      playSlide();

      document.getElementById('screen-lobby').classList.add('hidden');
      document.getElementById('screen-arena').classList.remove('hidden');

      renderArenaPlayerNodes();
    }

    function returnToLobbyConfig() {
      playSlide();
      document.getElementById('screen-arena').classList.add('hidden');
      document.getElementById('screen-lobby').classList.remove('hidden');
    }

    // Positioning client nodes radially around the track
    function renderArenaPlayerNodes() {
      const container = document.getElementById('arena-players-wrapper');
      container.innerHTML = '';

      const count = players.length;
      const radiusPercentage = 41; // Radiating player anchors on outer periphery

      players.forEach((p, i) => {
        const phi = (i * 2 * Math.PI) / count - Math.PI / 2; // Offset to coordinate with top layout
        const pctX = 50 + radiusPercentage * Math.cos(phi);
        const pctY = 50 + radiusPercentage * Math.sin(phi);

        const node = document.createElement('div');
        node.id = `player-node-${i}`;
        node.className = "absolute flex flex-col items-center justify-center transition-all duration-300 z-30 pointer-events-none";
        node.style.left = `${pctX}%`;
        node.style.top = `${pctY}%`;
        node.style.transform = `translate(-50%, -50%)`;

        // Create individual visually rich circle for the avatar
        node.innerHTML = `
          <div class="relative flex items-center justify-center w-12 h-12 rounded-full border-2 border-slate-600 bg-slate-900/90 shadow-lg transition-transform duration-300">
            <span class="text-xl select-none">${p.emoji}</span>
            <span class="absolute -bottom-1 -right-1 text-[8px] font-mono font-bold px-1.5 py-0.2 rounded-full text-emerald-300 bg-emerald-950/80 border border-emerald-500/30">
              ${p.score}
            </span>
          </div>
          <span class="text-[9.5px] font-black text-slate-300 bg-black/60 px-2 py-0.5 rounded-full border border-white/5 mt-1 max-w-[72px] truncate">
            ${p.name}
          </span>
        `;
        container.appendChild(node);
      });
    }

    // 3. SPIN MOTOR & BOTTLE WHEEL WHIRR PITCH DECAY SYNCHRONIZER
    function spinActiveWheel() {
      if (isCurrentlySpinning || players.length < 2) return;
      isCurrentlySpinning = true;
      playClick();

      // Disable interactions
      const spinBtn = document.getElementById('spin-btn');
      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-40');

      // Refresh dynamic queue just in case
      initQueuesIfDepleted();

      // Clear any past target node highlighting
      players.forEach((_, idx) => {
        const past = document.getElementById(`player-node-${idx}`);
        if(past) {
          const innerCircle = past.querySelector('.relative');
          innerCircle.className = "relative flex items-center justify-center w-12 h-12 rounded-full border-2 border-slate-600 bg-slate-900/90 shadow-lg transition-transform duration-300";
        }
      });

      const randomTurns = 5 + Math.random() * 5; // Rotation factor
      const spinGoalDegrees = randomTurns * 360 + Math.random() * 360;
      const baseRotation = currentBottleDegree;
      const targetRotationTotal = baseRotation + spinGoalDegrees;
      
      const duration = 2800 + Math.random() * 800; // Duration of spinning
      const startTime = performance.now();

      // Realtime whirr sound parameters: track speed decays
      let lastTickDegree = 0;
      const tickStep = 360 / players.length; // Tick on every player intersection boundary

      function performFrame(now) {
        const progress = Math.min(1, (now - startTime) / duration);
        
        // Easing function: Cubic Out for realistic spinning deceleration
        const easeVal = 1 - Math.pow(1 - progress, 3);
        const currentRot = baseRotation + (spinGoalDegrees * easeVal);
        
        const bottleRef = document.getElementById('bottle');
        bottleRef.style.transform = `rotate(${currentRot}deg)`;

        // 5. Sound synchronization whirr decay
        const degreeDelta = currentRot - lastTickDegree;
        if (Math.abs(degreeDelta) >= tickStep) {
          const speedPercentage = 1 - progress; // Linear velocity estimation
          playTickSound(speedPercentage);
          lastTickDegree = currentRot;
        }

        if (progress < 1) {
          requestAnimationFrame(performFrame);
        } else {
          // Wrap angular degrees to 360 range
          currentBottleDegree = targetRotationTotal % 360;
          
          // Determine targeted player
          // The bottle pointing index is at top (0 degrees).
          const singleSec = 360 / players.length;
          // Compensate rotation so pointing matches correctly
          const pointingAngle = (360 - (currentBottleDegree % 360)) % 360;
          selectedVictimIndex = Math.floor(((pointingAngle + (singleSec / 2)) % 360) / singleSec);
          if (selectedVictimIndex >= players.length) selectedVictimIndex = 0;

          triggerVictimLanding();
        }
      }

      requestAnimationFrame(performFrame);
    }

    // TARGET LANDING DESIGN CELEBRATION
    function triggerVictimLanding() {
      playDing();
      
      const node = document.getElementById(`player-node-${selectedVictimIndex}`);
      if (node) {
        const circle = node.querySelector('.relative');
        circle.className = "relative flex items-center justify-center w-12 h-12 rounded-full border-2 border-cyan-400 bg-cyan-950 text-white shadow-xl scale-110 animate-target-land";
      }

      // Briefly display target outcome decision screen after delay
      setTimeout(() => {
        document.getElementById('screen-arena').classList.add('hidden');
        document.getElementById('screen-destiny').classList.remove('hidden');
        
        const targetGuest = players[selectedVictimIndex];
        document.getElementById('victim-title').innerText = `${targetGuest.emoji} ${targetGuest.name}'s Choice!`;
        
        // Reset spin button values
        const spinBtn = document.getElementById('spin-btn');
        spinBtn.disabled = false;
        spinBtn.classList.remove('opacity-40');
        isCurrentlySpinning = false;
      }, 900);
    }

    function dismissToArenaWheel() {
      playSlide();
      document.getElementById('screen-destiny').classList.add('hidden');
      document.getElementById('screen-arena').classList.remove('remove');
      document.getElementById('screen-arena').classList.add('flex');
      goToArenaLayout();
    }

    // 4. DUPLICATE PROTECTION: ENSURE NON-REPETITIVE QUESTION PULLS
    function initQueuesIfDepleted() {
      const cats = ['friends', 'couples', 'family', 'deep', 'extreme', 'dark'];
      cats.forEach(c => {
        if (!runtimeQueues[c]) {
          runtimeQueues[c] = { truths: [], dares: [] };
        }
        if (!runtimeQueues[c].truths || runtimeQueues[c].truths.length === 0) {
          runtimeQueues[c].truths = [...MASTER_QUESTION_DATABASE[c].truths];
        }
        if (!runtimeQueues[c].dares || runtimeQueues[c].dares.length === 0) {
          runtimeQueues[c].dares = [...MASTER_QUESTION_DATABASE[c].dares];
        }
      });
    }

    function pullUnplayedPrompt(deck, type) {
      initQueuesIfDepleted();
      
      const targetArr = runtimeQueues[deck][type === 'truth' ? 'truths' : 'dares'];
      
      // If array gets exhausted inside game, reload immediately
      if (targetArr.length === 0) {
        runtimeQueues[deck][type === 'truth' ? 'truths' : 'dares'] = [...MASTER_QUESTION_DATABASE[deck][type === 'truth' ? 'truths' : 'dares']];
      }

      // Random splice selection to ensure absolute uniqueness
      const index = Math.floor(Math.random() * targetArr.length);
      const selected = targetArr.splice(index, 1)[0];
      return selected;
    }

    // DESTINY DECISION INITIATOR
    function launchTargetChallenge(type) {
      selectedPromptType = type;
      playSlide();

      // Update challenge layouts
      document.getElementById('screen-destiny').classList.add('hidden');
      document.getElementById('screen-challenge').classList.remove('hidden');

      const targetGuest = players[selectedVictimIndex];
      document.getElementById('label-active-guest').innerText = `${targetGuest.emoji} ${targetGuest.name}`;

      const pill = document.getElementById('challengePillType');
      if (type === 'truth') {
        pill.innerText = "TRUTH";
        pill.className = "text-[8.5px] font-black tracking-widest px-2.5 py-0.5 rounded-full border bg-cyan-500/10 border-cyan-400 text-cyan-300 shadow-[0_0_8px_rgba(6,182,212,0.15)]";
      } else {
        pill.innerText = "DARE";
        pill.className = "text-[8.5px] font-black tracking-widest px-2.5 py-0.5 rounded-full border bg-rose-500/10 border-rose-400 text-rose-300 shadow-[0_0_8px_rgba(244,63,94,0.15)]";
      }

      // Update category tag
      document.getElementById('challengeCategoryBadge').innerText = currentThemeDeck.toUpperCase();

      // Retrieve non-repetitive prompt card
      const promptText = pullUnplayedPrompt(currentThemeDeck, type);
      document.getElementById('challengeTextPrompt').innerText = promptText;
    }

    // 4. FUNCTIONAL RUNTIME SKIP CARD TRACKER
    function skipActivePrompt() {
      playSlide();
      
      const promptText = pullUnplayedPrompt(currentThemeDeck, selectedPromptType);
      
      const promptEl = document.getElementById('challengeTextPrompt');
      promptEl.style.opacity = '0.1';
      
      setTimeout(() => {
        promptEl.innerText = promptText;
        promptEl.style.opacity = '1';
      }, 150);
    }

    // 6. HARDWARE-ACCELERATED INSTANT ROUTING: Pop effect followed by seamless Arena view. Zero lag!
    function triggerCompletedRoute() {
      playSuccessChord();

      // Incremental point update
      if (players[selectedVictimIndex]) {
        players[selectedVictimIndex].score += 15; // Complete points
      }

      const completedBtn = document.getElementById('completed-btn');
      // Visual instant scale pop feedback
      completedBtn.classList.add('animate-pop-scale');

      setTimeout(() => {
        completedBtn.classList.remove('animate-pop-scale');
        
        // Immediate screen routing swap
        document.getElementById('screen-challenge').classList.add('hidden');
        document.getElementById('screen-arena').classList.remove('hidden');
        
        renderArenaPlayerNodes();
      }, 150);
    }

    function retreatToArenaWheel() {
      playSlide();
      document.getElementById('screen-challenge').classList.add('hidden');
      document.getElementById('screen-arena').classList.remove('hidden');
      renderArenaPlayerNodes();
    }
  </script>
